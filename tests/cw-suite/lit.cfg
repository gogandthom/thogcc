import lit.formats
import os.path

config.name = "coursework test suite"
config.test_format = lit.formats.ShTest(True)
config.suffixes = ['.c']
config.excludes = ["driver"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.path.join(config.test_source_root, 'out')

config.substitutions.append(
    ('%thogcc', os.path.abspath(
        os.path.join(config.test_source_root, '../..', 'build', 'c_compiler')
    ))
)

config.substitutions.append(
    ('%riscv_gcc', 'riscv32-unknown-elf-gcc -march=rv32gc -mabi=ilp32d')
)

config.substitutions.append(('FileCheck', 'filecheck'))
