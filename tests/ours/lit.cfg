import lit.formats
import os.path

config.name = "our own test suite"
config.test_format = lit.formats.ShTest(True)
config.suffixes = [".c"]
config.excludes = ["driver"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.path.join(config.test_source_root, "out")

config.substitutions.insert(
    0,
    (
        "%thogcc",
        os.path.abspath(
            os.path.join(
                config.test_source_root, "../..", "build", "c_compiler"
            )
        ),
    ),
)

config.substitutions.insert(
    0, ("%riscv_gcc", "riscv32-unknown-elf-gcc -march=rv32gc -mabi=ilp32d")
)

run_pipeline = (
    "%thogcc -S %s -o %t.s && "
    "%riscv_gcc -c %t.s -o %t.o && "
    "%riscv_gcc -static %t.o %S/driver/$(basename %s .c)_driver.c -o %t && "
    "spike --isa=rv32gc pk %t && "
    "echo $?"
)

config.substitutions.insert(0, ("%runtest", run_pipeline))

config.substitutions.append(("FileCheck", "filecheck"))
